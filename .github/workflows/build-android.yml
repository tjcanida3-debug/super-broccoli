name: Build PitNudge Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract PitNudge Android project
        run: unzip -oq PitNudge-Android-Cloud-Build-Project.zip
      - name: Apply PitNudge v0.3 vehicle photo update
        shell: bash
        run: |
          set -euo pipefail
          cat v03-overlay/index.part?? > app/src/main/assets/index.html
          cp v03-overlay/MainActivity.java app/src/main/java/com/pitnudge/app/MainActivity.java
          cp v03-overlay/app-build.gradle app/build.gradle
          cp v03-overlay/root-build.gradle build.gradle
          cp v03-overlay/google-services.json app/google-services.json
          echo "Applied v0.3 source overlay to Android project"
      - name: Install Android GPS mileage tracking update (v0.5)
        shell: bash
        run: |
          set -euo pipefail
          cat v05-overlay/html.b64.part?? | base64 -d > app/src/main/assets/index.html
          cat v05-overlay/java.b64.part?? | base64 -d > app/src/main/java/com/pitnudge/app/MainActivity.java
          cat v05-overlay/service.b64.part?? | base64 -d > app/src/main/java/com/pitnudge/app/MileageService.java
          cat v05-overlay/manifest.b64.part?? | base64 -d > app/src/main/AndroidManifest.xml
          cat v05-overlay/gradle.b64.part?? | base64 -d > app/build.gradle
          echo 'Applied native GPS mileage update'
      - name: Install PitNudge tracking status icon (v0.6)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d v06-overlay/tracking-status-icon.png.b64 > app/src/main/res/drawable-nodpi/ic_tracking_status.png
          grep -q 'setSmallIcon(android.R.drawable.ic_menu_mylocation)' app/src/main/java/com/pitnudge/app/MileageService.java
          sed -i 's/setSmallIcon(android.R.drawable.ic_menu_mylocation)/setSmallIcon(R.drawable.ic_tracking_status)/g' app/src/main/java/com/pitnudge/app/MileageService.java
          sed -i 's/versionCode 8/versionCode 9/g; s/versionName '\''0.5.0'\''/versionName '\''0.6.0'\''/g' app/build.gradle
          grep -q 'setSmallIcon(R.drawable.ic_tracking_status)' app/src/main/java/com/pitnudge/app/MileageService.java
          test -s app/src/main/res/drawable-nodpi/ic_tracking_status.png
          echo "PitNudge tracking notification icon installed"
      - name: Apply PitNudge v0.7 trip route maps
        shell: bash
        run: |
          set -euo pipefail
          cat v07-overlay/index.part?? > app/src/main/assets/index.html
          cat v07-overlay/MainActivity.part?? > app/src/main/java/com/pitnudge/app/MainActivity.java
          cat v07-overlay/MileageService.part?? > app/src/main/java/com/pitnudge/app/MileageService.java
          cat v07-overlay/app-build.gradle.part?? > app/build.gradle
          grep -q 'saveRouteMaps' app/src/main/assets/index.html
          grep -q 'setSmallIcon(R.drawable.ic_tracking_status)' app/src/main/java/com/pitnudge/app/MileageService.java
          grep -q 'versionCode 10' app/build.gradle
          echo "Applied v0.7 optional route maps and GPS samples"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform and build tools
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found under $SDK_ROOT"
            exit 1
          fi
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preserve test signing identity
        uses: actions/cache@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: pitnudge-android-debug-signing-v1
      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Report Android certificate fingerprints
        run: gradle --no-daemon :app:signingReport
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PitNudge-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
